<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotation">
<title>Rotation</title>
<style>
:root{
  --ink:#101420;
  --surface:#171f2f;
  --surface-2:#1f2a3d;
  --line:#2a3550;
  --text:#e8ecf5;
  --muted:#828da6;
  --day:#f0a848;
  --night:#7295dd;
  --off:#63c7a0;
  --accent:var(--night);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink)}
body{
  font-family:var(--body);
  color:var(--text);
  min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 48px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto}

.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ---------- rotation strip: the signature ---------- */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg{
  position:relative;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:5px;
  padding:13px 4px 11px;
  text-align:center;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  color:var(--muted);
  cursor:pointer;
  transition:border-color .25s,background .25s,color .25s;
}
.seg[data-live="1"]{
  color:var(--ink);
  background:var(--accent);
  border-color:var(--accent);
  font-weight:700;
}
.seg .tick{
  display:block;
  height:2px;width:16px;
  margin:0 auto 8px;
  border-radius:1px;
  background:var(--line);
  transition:background .25s,width .25s;
}
.seg[data-live="1"] .tick{background:rgba(16,20,32,.55);width:26px}

.phase{margin:16px 0 22px}
.phase h1{
  font-size:31px;
  font-weight:800;
  letter-spacing:-.028em;
  line-height:1.05;
  color:var(--accent);
  transition:color .25s;
}
.phase .hours{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.05em}
.nudge{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  background:none;border:none;
  font-family:var(--body);
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  padding:0;
}

/* ---------- progress ---------- */
.meter{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.bar{flex:1;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .35s ease,background .25s}
.meter .count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}

/* ---------- habits ---------- */
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.head button{
  background:none;border:none;color:var(--muted);
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  cursor:pointer;padding:4px 0;
}
.head button[data-on="1"]{color:var(--accent)}

.list{display:flex;flex-direction:column;gap:7px}
.habit{
  display:flex;align-items:center;gap:13px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px;
  padding:15px 15px;
  cursor:pointer;
  transition:border-color .2s,background .2s,opacity .2s;
}
.habit:active{transform:scale(.993)}
.habit[data-done="1"]{border-color:var(--accent);background:var(--surface-2)}
.habit[data-done="1"] .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.box{
  flex:0 0 20px;height:20px;border-radius:5px;
  border:1.5px solid var(--line);
  display:grid;place-items:center;
  transition:border-color .2s,background .2s;
}
.habit[data-done="1"] .box{background:var(--accent);border-color:var(--accent)}
.box svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
.habit[data-done="1"] .box svg{opacity:1}
.name{flex:1;font-size:15.5px;letter-spacing:-.005em}
.streak{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.streak b{color:var(--accent);font-weight:600}

.habit.resting{opacity:.42}
.habit.resting .name{font-style:italic}

.chips{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 8px;border-radius:4px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  cursor:pointer;
}
.chip[data-on="1"]{border-color:var(--accent);color:var(--accent)}
.kill{
  background:none;border:none;color:var(--muted);
  font-size:17px;line-height:1;padding:4px 2px 4px 8px;cursor:pointer;
}
.editrow{display:none}
.editing .editrow{display:block}
.editing .streak{display:none}

.empty{
  border:1px dashed var(--line);border-radius:8px;
  padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px;
}

/* ---------- add ---------- */
.add{margin-top:16px;border:1px dashed var(--line);border-radius:8px;padding:13px}
.add .row{display:flex;gap:8px}
.add input{
  flex:1;background:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:11px 12px;color:var(--text);font-size:15px;font-family:var(--body);
}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:none;border-color:var(--accent)}
.add .go{
  background:var(--accent);border:none;border-radius:6px;
  color:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  padding:0 15px;cursor:pointer;font-weight:700;
}
.add .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:11px 0 7px}

/* ---------- history ---------- */
.history{margin-top:34px}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:11px}
.cell{
  aspect-ratio:1;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);
}
.cell[data-lvl="1"]{background:rgba(99,199,160,.22);border-color:rgba(99,199,160,.3)}
.cell[data-lvl="2"]{background:rgba(99,199,160,.5);border-color:rgba(99,199,160,.6)}
.cell[data-lvl="3"]{background:var(--off);border-color:var(--off)}
.cell[data-today="1"]{box-shadow:0 0 0 1.5px var(--accent)}
.legend{display:flex;justify-content:space-between;margin-top:9px}

.foot{margin-top:34px;display:flex;gap:9px}
.foot button{
  flex:1;background:transparent;border:1px solid var(--line);border-radius:7px;
  padding:11px;color:var(--muted);font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
}
.foot button.danger{color:#d97070;border-color:rgba(217,112,112,.3)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="eyebrow">Rotation</span>
    <span class="eyebrow" id="today"></span>
  </div>

  <div class="strip" id="strip"></div>

  <div class="phase">
    <h1 id="phaseName"></h1>
    <div class="hours" id="phaseHours"></div>
    <button class="nudge" id="nudge">Wrong day? Tap the block you're actually on.</button>
  </div>

  <div class="meter">
    <div class="bar"><span id="barFill"></span></div>
    <div class="count" id="count"></div>
  </div>

  <div class="head">
    <span class="eyebrow">On today</span>
    <button id="editBtn">Edit</button>
  </div>
  <div class="list" id="list"></div>

  <div class="add">
    <div class="row">
      <input id="newName" placeholder="Add something you want to keep up" autocomplete="off">
      <button class="go" id="addBtn">ADD</button>
    </div>
    <div class="hint">Show it on</div>
    <div class="chips" id="newPhases"></div>
  </div>

  <div class="history">
    <span class="eyebrow">Last 14 days</span>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span class="eyebrow" id="calStart"></span>
      <span class="eyebrow">Today</span>
    </div>
  </div>

  <div class="foot">
    <button id="clearDay">Clear today</button>
    <button class="danger" id="wipe">Erase everything</button>
  </div>
</div>

<script>
const PHASES = [
  {id:'day',   label:'DAY',  name:'Day shift',    hours:'07:00 → 19:00', color:'var(--day)'},
  {id:'night', label:'NGHT', name:'Night shift',  hours:'19:00 → 07:00', color:'var(--night)'},
  {id:'off1',  label:'OFF',  name:'First day off',hours:'Yours, all of it', color:'var(--off)'},
  {id:'off2',  label:'OFF',  name:'Second day off',hours:'Yours, all of it', color:'var(--off)'}
];

const SEED = [
  {name:'Trading hour',            phases:['day','night','off1','off2']},
  {name:'Gym',                     phases:['night','off2']},
  {name:'Deep trading analysis',   phases:['off1','off2']},
  {name:'Fusion 360',              phases:['off1','off2']},
  {name:'Read',                    phases:['day','night','off1','off2']},
  {name:'Football',                phases:['off1','off2']}
];

const K = 'rotation.v1';
let S, editing = false, draftPhases = ['day','night','off1','off2'];

function iso(d){ return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function todayISO(){ return iso(new Date()); }
function shiftISO(s, n){ const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function load(){
  try { S = JSON.parse(localStorage.getItem(K)); } catch(e){ S = null; }
  if (!S || !S.habits){
    S = {
      anchorDate: todayISO(),
      anchorIndex: 1,              // seeded: today is a night shift
      habits: SEED.map(h => ({id:uid(), name:h.name, phases:h.phases})),
      log: {}
    };
    save();
  }
}
function save(){ try { localStorage.setItem(K, JSON.stringify(S)); } catch(e){} }

function phaseIndexOn(dateStr){
  const a = new Date(S.anchorDate+'T12:00:00'), b = new Date(dateStr+'T12:00:00');
  const days = Math.round((b-a)/864e5);
  return ((S.anchorIndex + days) % 4 + 4) % 4;
}
function phaseOn(dateStr){ return PHASES[phaseIndexOn(dateStr)]; }
function appliesOn(h, dateStr){ return h.phases.includes(phaseOn(dateStr).id); }
function doneOn(id, dateStr){ return (S.log[dateStr] || []).includes(id); }

function streak(h){
  let n = 0, d = todayISO(), guard = 0;
  while (guard++ < 400){
    if (appliesOn(h, d)){
      if (doneOn(h.id, d)) n++;
      else if (d !== todayISO()) break;
      else if (n === 0 && !doneOn(h.id, d)) { /* today still open */ }
    }
    d = shiftISO(d, -1);
  }
  return n;
}

function render(){
  const t = todayISO();
  const p = phaseOn(t);
  document.documentElement.style.setProperty('--accent', p.color);
  document.querySelector('meta[name=theme-color]').setAttribute('content','#101420');

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});

  // rotation strip
  const idx = phaseIndexOn(t);
  document.getElementById('strip').innerHTML = PHASES.map((ph,i)=>
    `<div class="seg" data-i="${i}" data-live="${i===idx?1:0}"><span class="tick"></span>${ph.label}</div>`
  ).join('');

  document.getElementById('phaseName').textContent = p.name;
  document.getElementById('phaseHours').textContent = p.hours;

  // habits
  const on  = S.habits.filter(h => appliesOn(h, t));
  const off = S.habits.filter(h => !appliesOn(h, t));
  const done = on.filter(h => doneOn(h.id, t)).length;

  document.getElementById('barFill').style.width = on.length ? (done/on.length*100)+'%' : '0%';
  document.getElementById('count').textContent = `${done} / ${on.length}`;

  const row = (h, resting) => `
    <div class="habit ${resting?'resting':''}" data-id="${h.id}" data-done="${!resting && doneOn(h.id,t)?1:0}">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:13px">
          ${resting ? '<div class="box" style="opacity:.3"></div>' : `<div class="box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.4L4.6 9 10 3.2" stroke="#101420" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
          <span class="name">${esc(h.name)}</span>
          ${resting ? '' : `<span class="streak">${streak(h) ? `<b>${streak(h)}</b> day` : '—'}</span>`}
        </div>
        <div class="editrow">
          <div class="chips">
            ${PHASES.map(ph=>`<button class="chip" data-h="${h.id}" data-p="${ph.id}" data-on="${h.phases.includes(ph.id)?1:0}">${ph.id==='off1'?'OFF 1':ph.id==='off2'?'OFF 2':ph.label}</button>`).join('')}
          </div>
        </div>
      </div>
      <button class="kill editrow" data-kill="${h.id}">×</button>
    </div>`;

  const list = document.getElementById('list');
  list.className = 'list' + (editing ? ' editing' : '');
  list.innerHTML =
    (on.length ? on.map(h=>row(h,false)).join('') : '<div class="empty">Nothing scheduled for this phase. Tap Edit to move something here.</div>')
    + (editing || !off.length ? '' : '')
    + (off.length ? off.map(h=>row(h,true)).join('') : '');

  // add-form phase chips
  document.getElementById('newPhases').innerHTML = PHASES.map(ph=>
    `<button class="chip" data-draft="${ph.id}" data-on="${draftPhases.includes(ph.id)?1:0}">${ph.id==='off1'?'OFF 1':ph.id==='off2'?'OFF 2':ph.label}</button>`
  ).join('');

  // 14-day history
  let cells = '';
  for (let i = 13; i >= 0; i--){
    const d = shiftISO(t, -i);
    const due = S.habits.filter(h => appliesOn(h, d)).length;
    const hit = (S.log[d] || []).length;
    const r = due ? hit/due : 0;
    const lvl = r === 0 ? 0 : r < .5 ? 1 : r < 1 ? 2 : 3;
    cells += `<div class="cell" data-lvl="${lvl}" data-today="${i===0?1:0}" title="${d} · ${hit}/${due}"></div>`;
  }
  document.getElementById('cal').innerHTML = cells;
  document.getElementById('calStart').textContent =
    new Date(shiftISO(t,-13)+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});

  document.getElementById('editBtn').textContent = editing ? 'Done' : 'Edit';
  document.getElementById('editBtn').setAttribute('data-on', editing?1:0);
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function toggle(id){
  const t = todayISO();
  S.log[t] = S.log[t] || [];
  const i = S.log[t].indexOf(id);
  if (i > -1) S.log[t].splice(i,1); else S.log[t].push(id);
  save(); render();
}

document.addEventListener('click', e => {
  const seg = e.target.closest('.seg');
  if (seg){
    S.anchorDate = todayISO();
    S.anchorIndex = +seg.dataset.i;
    save(); render(); return;
  }

  const chip = e.target.closest('.chip');
  if (chip){
    if (chip.dataset.draft){
      const p = chip.dataset.draft;
      const i = draftPhases.indexOf(p);
      if (i > -1) draftPhases.splice(i,1); else draftPhases.push(p);
    } else {
      const h = S.habits.find(x => x.id === chip.dataset.h);
      const p = chip.dataset.p;
      const i = h.phases.indexOf(p);
      if (i > -1) h.phases.splice(i,1); else h.phases.push(p);
      save();
    }
    render(); return;
  }

  const kill = e.target.closest('[data-kill]');
  if (kill){
    S.habits = S.habits.filter(h => h.id !== kill.dataset.kill);
    save(); render(); return;
  }

  const hab = e.target.closest('.habit');
  if (hab && !editing && !hab.classList.contains('resting')){ toggle(hab.dataset.id); return; }
});

document.getElementById('editBtn').onclick = () => { editing = !editing; render(); };
document.getElementById('nudge').onclick   = () => { document.getElementById('strip').scrollIntoView({behavior:'smooth',block:'center'}); };

function addHabit(){
  const inp = document.getElementById('newName');
  const name = inp.value.trim();
  if (!name) return;
  S.habits.push({ id: uid(), name, phases: draftPhases.length ? [...draftPhases] : ['day','night','off1','off2'] });
  inp.value = '';
  save(); render();
}
document.getElementById('addBtn').onclick = addHabit;
document.getElementById('newName').addEventListener('keypress', e => { if (e.key === 'Enter') addHabit(); });

document.getElementById('clearDay').onclick = () => {
  if (confirm('Untick everything for today?')){ delete S.log[todayISO()]; save(); render(); }
};
document.getElementById('wipe').onclick = () => {
  if (confirm('This deletes every habit and all history. There is no undo.')){
    localStorage.removeItem(K); load(); render();
  }
};

// installable manifest, generated inline so the file stays self-contained
(function(){
  const m = {
    name:'Rotation', short_name:'Rotation', start_url:'.', display:'standalone',
    background_color:'#101420', theme_color:'#101420',
    icons:[{src:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#101420"/><rect x="34" y="86" width="28" height="20" rx="4" fill="#f0a848"/><rect x="70" y="86" width="28" height="20" rx="4" fill="#7295dd"/><rect x="106" y="86" width="28" height="20" rx="4" fill="#63c7a0"/><rect x="142" y="86" width="16" height="20" rx="4" fill="#63c7a0"/></svg>'), sizes:'192x192', type:'image/svg+xml'}]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:'application/json'}));
  document.head.appendChild(l);
})();

load(); render();
</script>
</body>
</html>
